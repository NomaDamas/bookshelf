<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src about:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Bookshelf visual</title>
  <style>
    :root { color-scheme: light; background: #fafafa; color: #242424; }
    :root[data-theme=dark] { color-scheme: dark; background: #242526; color: #ececec; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font: 13px -apple-system, sans-serif; }
    body { padding: 12px; overflow: auto; }
    #preview { width: 100%; min-height: 160px; }
    #preview > svg { display: block; width: 100%; height: auto; margin: 0 auto; }
    iframe { width: 100%; height: max(390px, calc(100vh - 24px)); border: 0; display: block; }
  </style>
  <script defer src="renderer.js"></script>
</head>
<body><main id="preview" aria-label="Visual preview"></main></body>
</html>

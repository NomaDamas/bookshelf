name: Bug report
description: Report a reproducible problem in the native reader, CLI, OCR, or MCP.
body:
  - type: markdown
    attributes:
      value: Use synthetic PDFs and remove private paths, notes, and credentials. Follow SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands or UI steps and a minimal authored fixture when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Apple Silicon or Intel, Xcode/Swift version, commit, and OCR versions if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Include the error and checks you ran. Do not attach an entire private library or database.

name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The debug test build and the release package build share no products,
  # so separate runners finish them in parallel.
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Dependency sources only; build products are never restored, so every build starts clean.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/workspace-state.json
          key: swiftpm-sources-${{ hashFiles('Package.resolved') }}
      # Bridge process tests run synthetic scripts with Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Record toolchain
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcodebuild -version
          swift --version
          node --version
      - name: Check generated metadata and tokens
        run: |
          python3 scripts/app-metadata.py check
          python3 scripts/generate-reader-tokens.py --check
          git diff --check
      - name: Test
        run: swift test

  verify:
    name: Build and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/workspace-state.json
          key: swiftpm-sources-${{ hashFiles('Package.resolved') }}
      # pnpm must be on PATH before setup-node can cache its store.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Sources/BookshelfAgent/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Record toolchain
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcodebuild -version
          swift --version
          node --version
          pnpm --version
          bun --version
      - name: Build, create DMG, and verify copied app
        run: python3 scripts/release.py package
      - name: Retain failed DMGs for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Failed-DMG-diagnostic-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bookside-preview-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  agent:
    name: Learning agent bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Sources/BookshelfAgent/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Check the bridge without provider credentials
        run: |
          pnpm --dir Sources/BookshelfAgent install --frozen-lockfile --ignore-scripts
          pnpm --dir Sources/BookshelfAgent run typecheck
          pnpm --dir Sources/BookshelfAgent test
          pnpm --dir Sources/BookshelfAgent run build
          python3 scripts/copy-agent-licenses.py dist/agent/notices

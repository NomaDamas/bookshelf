name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release candidate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact version tag on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate-tag "$RELEASE_TAG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Test
        run: swift test
      - name: Build and verify distribution
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare GitHub draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
      - name: Create a draft without replacing published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect it manually instead of overwriting assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --prerelease \
            --title "Bookside $RELEASE_TAG" --notes-file release-notes.md
